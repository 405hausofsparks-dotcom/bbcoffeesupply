<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | B&amp;B Coffee Supply</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/assets/icons/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#14140f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="error-page">
  <main class="error-wrap">
    <picture>
      <source srcset="/assets/images/logo.webp" type="image/webp" />
      <img class="error-logo" src="/assets/images/logo.png" width="200" height="183"
           alt="Bombed &amp; Burnt Coffee Co. emblem" />
    </picture>
    <p class="error-code">404</p>
    <h1 class="error-title">This page went cold.</h1>
    <p class="error-text">
      The page you're looking for isn't here &mdash; it may have moved, or the
      link may be off. Let's get you back to fresh coffee.
    </p>
    <div class="error-actions">
      <a class="btn btn-primary" href="/">Back to Home</a>
      <a class="btn btn-ghost error-ghost" href="/#contact">Contact Us</a>
    </div>
  </main>
</body>
</html>
